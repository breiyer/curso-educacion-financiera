<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glosario · Vida crediticia desde cero</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-base="" data-page="glosario" data-id="glosario">
<main>
<div class="wrap">
  <div class="kicker">Recursos</div>
  <h1>Glosario financiero</h1>
  <p>Busca cualquier término del curso.</p>
  <input class="search" id="q" type="search" placeholder="Buscar: usura, UVR, pagaré, score…" aria-label="Buscar en el glosario" autofocus>
  <p class="meta" id="count"></p>
  <div id="list"></div>
</div>
</main>
<script src="js/finance.js"></script>
<script src="js/glossary.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var G = window.GLOSSARY.slice().sort(function (a, b) { return a[0].localeCompare(b[0], 'es'); });
  var list = document.getElementById('list'), q = document.getElementById('q');
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function render() {
    var t = norm(q.value.trim());
    var r = G.filter(function (g) { return !t || norm(g[0]).indexOf(t) >= 0 || norm(g[1]).indexOf(t) >= 0; });
    list.innerHTML = r.map(function (g) { return '<div class="gloss-item"><b>' + g[0] + '</b><br>' + g[1] + '</div>'; }).join('') || '<p>Sin resultados.</p>';
    document.getElementById('count').textContent = r.length + ' de ' + G.length + ' términos';
  }
  q.addEventListener('input', render); render();
});
</script>
</body>
</html>
